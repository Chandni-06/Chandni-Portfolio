<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <rect width="1200" height="700" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect width="1200" height="60" fill="#1e293b"/>
  <text x="30" y="38" font-family="sans-serif" font-weight="bold" font-size="20" fill="#38bdf8">🐍 Python Analytics | E-Commerce Customer Churn Correlation Model</text>
  <rect x="40" y="90" width="1120" height="560" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="70" y="140" font-family="sans-serif" font-weight="bold" font-size="20" fill="#ffffff">Seaborn Heatmap &amp; Feature Importance Plot</text>
  <g transform="translate(70, 180)">
    <!-- Heatmap Grid -->
    <rect x="0" y="0" width="80" height="80" fill="#2563eb" />
    <rect x="90" y="0" width="80" height="80" fill="#0ea5e9" />
    <rect x="180" y="0" width="80" height="80" fill="#f43f5e" />
    
    <rect x="0" y="90" width="80" height="80" fill="#0ea5e9" />
    <rect x="90" y="90" width="80" height="80" fill="#2563eb" />
    <rect x="180" y="90" width="80" height="80" fill="#38bdf8" />

    <text x="300" y="50" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">Strong Churn Drivers Identified:</text>
    <text x="300" y="90" font-family="sans-serif" font-size="14" fill="#38bdf8">• Delivery Delay Days (r = +0.72 correlation with churn)</text>
    <text x="300" y="120" font-family="sans-serif" font-size="14" fill="#38bdf8">• Support Ticket Count (r = +0.64 correlation with churn)</text>
    <text x="300" y="150" font-family="sans-serif" font-size="14" fill="#10b981">• Customer Tenure (r = -0.58 negative correlation)</text>
  </g>
</svg>
