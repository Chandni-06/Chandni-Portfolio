<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="pbi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pbi-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Dashboard Container Frame -->
  <rect width="1200" height="700" rx="16" fill="url(#pbi-bg)" stroke="#334155" stroke-width="2" />

  <!-- Power BI Top Nav Bar -->
  <rect width="1200" height="50" fill="#090d16" rx="16" />
  <rect y="46" width="1200" height="4" fill="url(#pbi-header)" />
  
  <text x="30" y="32" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff">📊 Power BI Report | Company Sales Executive Performance Dashboard</text>
  <text x="1020" y="32" font-family="sans-serif" font-size="13" fill="#38bdf8">Refreshed: Today, 09:00 AM</text>

  <!-- Left Slicers Bar -->
  <rect x="20" y="70" width="220" height="610" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="40" y="100" font-family="sans-serif" font-weight="bold" font-size="15" fill="#38bdf8">FILTERS & SLICERS</text>
  <line x1="40" y1="110" x2="220" y2="110" stroke="#334155" />

  <!-- Year Filter -->
  <text x="40" y="135" font-family="sans-serif" font-weight="bold" font-size="12" fill="#94a3b8">SELECT YEAR</text>
  <rect x="40" y="145" width="180" height="32" rx="6" fill="#0f172a" stroke="#2563eb" />
  <text x="55" y="166" font-family="sans-serif" font-size="13" fill="#ffffff">FY 2024 (All Quarters)</text>

  <!-- Region Slicer -->
  <text x="40" y="205" font-family="sans-serif" font-weight="bold" font-size="12" fill="#94a3b8">REGION</text>
  <rect x="40" y="215" width="180" height="30" rx="6" fill="#2563eb" />
  <text x="55" y="235" font-family="sans-serif" font-size="13" fill="#ffffff">✓ North America</text>
  <rect x="40" y="250" width="180" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="55" y="270" font-family="sans-serif" font-size="13" fill="#94a3b8">✓ Europe</text>
  <rect x="40" y="285" width="180" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="55" y="305" font-family="sans-serif" font-size="13" fill="#94a3b8">✓ Asia Pacific</text>

  <!-- Category Slicer -->
  <text x="40" y="345" font-family="sans-serif" font-weight="bold" font-size="12" fill="#94a3b8">PRODUCT CATEGORY</text>
  <rect x="40" y="355" width="180" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="55" y="375" font-family="sans-serif" font-size="13" fill="#e2e8f0">All Categories (3)</text>

  <!-- Main Content Grid -->
  <!-- Top KPI Cards -->
  <!-- KPI 1: Revenue -->
  <rect x="260" y="70" width="210" height="110" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2" />
  <text x="280" y="98" font-family="sans-serif" font-size="13" fill="#94a3b8">TOTAL REVENUE</text>
  <text x="280" y="135" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff">$4,852,400</text>
  <text x="280" y="162" font-family="sans-serif" font-weight="bold" font-size="12" fill="#10b981">▲ +18.4% YoY Growth</text>

  <!-- KPI 2: Profit Margin -->
  <rect x="490" y="70" width="210" height="110" rx="10" fill="#1e293b" stroke="#0ea5e9" />
  <text x="510" y="98" font-family="sans-serif" font-size="13" fill="#94a3b8">NET PROFIT MARGIN</text>
  <text x="510" y="135" font-family="sans-serif" font-weight="bold" font-size="28" fill="#38bdf8">24.5%</text>
  <text x="510" y="162" font-family="sans-serif" font-weight="bold" font-size="12" fill="#10b981">▲ +3.2% vs Target</text>

  <!-- KPI 3: Total Orders -->
  <rect x="720" y="70" width="210" height="110" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="740" y="98" font-family="sans-serif" font-size="13" fill="#94a3b8">TOTAL ORDERS</text>
  <text x="740" y="135" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff">52,410</text>
  <text x="740" y="162" font-family="sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">Avg Order: $92.5</text>

  <!-- KPI 4: Active Customers -->
  <rect x="950" y="70" width="220" height="110" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="970" y="98" font-family="sans-serif" font-size="13" fill="#94a3b8">RETENTION RATE</text>
  <text x="970" y="135" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff">88.2%</text>
  <text x="970" y="162" font-family="sans-serif" font-weight="bold" font-size="12" fill="#10b981">Top Rep: Sarah Jenkins</text>

  <!-- Middle Row: Revenue Trend Line Chart & Map -->
  <!-- Line Chart -->
  <rect x="260" y="200" width="530" height="280" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="280" y="230" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">Monthly Revenue Trend &amp; Target Forecast ($k)</text>
  
  <path d="M 290 430 L 330 400 L 370 410 L 410 370 L 450 350 L 490 380 L 530 320 L 570 300 L 610 320 L 650 270 L 690 260 L 730 240" fill="none" stroke="#38bdf8" stroke-width="4" />
  <path d="M 290 430 L 730 240 L 730 450 L 290 450 Z" fill="#2563eb" opacity="0.15" />
  <!-- Gridlines -->
  <line x1="280" y1="270" x2="760" y2="270" stroke="#334155" stroke-dasharray="4" />
  <line x1="280" y1="330" x2="760" y2="330" stroke="#334155" stroke-dasharray="4" />
  <line x1="280" y1="390" x2="760" y2="390" stroke="#334155" stroke-dasharray="4" />
  <line x1="280" y1="450" x2="760" y2="450" stroke="#475569" />
  <text x="280" y="470" font-family="sans-serif" font-size="10" fill="#94a3b8">Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec</text>

  <!-- Regional Bar Chart -->
  <rect x="810" y="200" width="360" height="280" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="830" y="230" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">Sales by Region ($M)</text>

  <!-- Bar 1 -->
  <text x="830" y="270" font-family="sans-serif" font-size="12" fill="#94a3b8">North America</text>
  <rect x="830" y="280" width="280" height="22" rx="4" fill="#2563eb" />
  <text x="1120" y="296" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">$2.1M</text>

  <!-- Bar 2 -->
  <text x="830" y="325" font-family="sans-serif" font-size="12" fill="#94a3b8">Europe</text>
  <rect x="830" y="335" width="210" height="22" rx="4" fill="#0ea5e9" />
  <text x="1050" y="351" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">$1.5M</text>

  <!-- Bar 3 -->
  <text x="830" y="380" font-family="sans-serif" font-size="12" fill="#94a3b8">Asia Pacific</text>
  <rect x="830" y="390" width="140" height="22" rx="4" fill="#38bdf8" />
  <text x="980" y="406" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">$0.9M</text>

  <!-- Bottom Row: Category Donut & Insights Table -->
  <rect x="260" y="500" width="410" height="180" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="280" y="530" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">Revenue Share by Category</text>
  <circle cx="350" cy="600" r="45" fill="none" stroke="#2563eb" stroke-width="20" stroke-dasharray="180 80" />
  <circle cx="350" cy="600" r="45" fill="none" stroke="#0ea5e9" stroke-width="20" stroke-dasharray="80 180" stroke-dashoffset="-180" />
  <text x="430" y="570" font-family="sans-serif" font-size="12" fill="#38bdf8">■ Tech (45%)</text>
  <text x="430" y="595" font-family="sans-serif" font-size="12" fill="#0ea5e9">■ Furniture (35%)</text>
  <text x="430" y="620" font-family="sans-serif" font-size="12" fill="#2563eb">■ Office Supplies (20%)</text>

  <rect x="690" y="500" width="480" height="180" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="710" y="530" font-family="sans-serif" font-weight="bold" font-size="15" fill="#10b981">💡 Key DAX Insights &amp; Business Actions</text>
  <text x="710" y="560" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Top performing category: Technology with 45% revenue contribution.</text>
  <text x="710" y="585" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Q4 Seasonal surge driven by North America enterprise renewals (+28%).</text>
  <text x="710" y="610" font-family="sans-serif" font-size="12" fill="#e2e8f0">• DAX YoY Measure shows positive growth trajectory across all 3 key regions.</text>
  <text x="710" y="635" font-family="sans-serif" font-size="12" fill="#94a3b8">Created by: Chandni Kumari | Data Source: Enterprise ERP System</text>
</svg>
