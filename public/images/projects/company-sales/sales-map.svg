<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <rect width="1200" height="700" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
  <rect width="1200" height="60" fill="#1e293b"/>
  <text x="30" y="38" font-family="sans-serif" font-weight="bold" font-size="20" fill="#38bdf8">Regional Sales Heatmap &amp; Geographical Analytics</text>
  
  <g transform="translate(60, 100)">
    <!-- Stylized Map Graphic -->
    <rect width="700" height="520" rx="12" fill="#1e293b" stroke="#334155"/>
    <!-- Simulated Continents & Hotspots -->
    <circle cx="220" cy="200" r="90" fill="#2563eb" opacity="0.4"/>
    <circle cx="220" cy="200" r="45" fill="#38bdf8" opacity="0.8"/>
    <text x="180" y="205" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff">North America ($2.1M)</text>

    <circle cx="480" cy="180" r="70" fill="#0ea5e9" opacity="0.4"/>
    <circle cx="480" cy="180" r="35" fill="#38bdf8" opacity="0.8"/>
    <text x="450" y="185" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff">Europe ($1.5M)</text>

    <circle cx="580" cy="320" r="60" fill="#10b981" opacity="0.4"/>
    <circle cx="580" cy="320" r="30" fill="#10b981" opacity="0.8"/>
    <text x="540" y="325" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff">APAC ($0.9M)</text>
  </g>

  <!-- Side Details -->
  <g transform="translate(800, 100)">
    <rect width="340" height="520" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="40" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">Geographic KPI Summary</text>
    
    <text x="20" y="90" font-family="sans-serif" font-size="13" fill="#94a3b8">Top Performing Hub</text>
    <text x="20" y="115" font-family="sans-serif" font-weight="bold" font-size="18" fill="#38bdf8">California, USA ($850K)</text>

    <text x="20" y="170" font-family="sans-serif" font-size="13" fill="#94a3b8">Fastest Growing Region</text>
    <text x="20" y="195" font-family="sans-serif" font-weight="bold" font-size="18" fill="#10b981">UK &amp; Germany (+24% YoY)</text>

    <text x="20" y="250" font-family="sans-serif" font-size="13" fill="#94a3b8">Active Distribution Centers</text>
    <text x="20" y="275" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff">18 Warehouses</text>
  </g>
</svg>
