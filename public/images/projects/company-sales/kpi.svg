<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <rect width="1200" height="700" rx="16" fill="#0b1120" stroke="#334155" stroke-width="2"/>
  <rect width="1200" height="60" fill="#1e293b"/>
  <text x="30" y="38" font-family="sans-serif" font-weight="bold" font-size="20" fill="#38bdf8">Custom DAX KPI Measures &amp; Metric Cards</text>
  <g transform="translate(60, 100)">
    <rect width="520" height="250" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
    <text x="30" y="40" font-family="sans-serif" font-weight="bold" font-size="16" fill="#38bdf8">DAX Measure: [Total Revenue]</text>
    <text x="30" y="70" font-family="monospace" font-size="14" fill="#10b981">Total Revenue = SUM(Sales[Revenue])</text>
    <text x="30" y="140" font-family="sans-serif" font-weight="bold" font-size="42" fill="#ffffff">$4,852,400</text>
    <text x="30" y="185" font-family="sans-serif" font-size="14" fill="#94a3b8">Target: $4,500,000 (107.8% Achieved)</text>
  </g>
  <g transform="translate(620, 100)">
    <rect width="520" height="250" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <text x="30" y="40" font-family="sans-serif" font-weight="bold" font-size="16" fill="#38bdf8">DAX Measure: [YoY Revenue Growth %]</text>
    <text x="30" y="70" font-family="monospace" font-size="13" fill="#10b981">YoY Growth = DIVIDE([Revenue] - [Prior Year], [Prior Year], 0)</text>
    <text x="30" y="140" font-family="sans-serif" font-weight="bold" font-size="42" fill="#10b981">+18.4%</text>
    <text x="30" y="185" font-family="sans-serif" font-size="14" fill="#94a3b8">Prior Year Revenue: $4,098,300</text>
  </g>
  <g transform="translate(60, 380)">
    <rect width="1080" height="260" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="40" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff">Executive Performance Slicers &amp; Dynamic Drilldown</text>
    <text x="30" y="80" font-family="sans-serif" font-size="14" fill="#e2e8f0">• Allows single-click cross-filtering across 4 geographic regions and 12 product categories.</text>
    <text x="30" y="110" font-family="sans-serif" font-size="14" fill="#e2e8f0">• Built with custom date dimensions table for Time Intelligence calculation.</text>
  </g>
</svg>
